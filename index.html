<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pleasure 1 Aluminum Enterprise | Aluminium & Glass Solutions</title>

<meta name="description" content="Pleasure 1 Aluminum Enterprise provides quality aluminium fabrication, sliding windows, glass doors and modern architectural solutions.">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* =========================
   GLOBAL STYLES
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    scroll-behavior:smooth;
}

body{
    font-family:'Segoe UI',Arial,sans-serif;
    background:#f8f9fa;
    color:#222;
    overflow-x:hidden;
}

:root{
    --primary:#5E2B97;
    --secondary:#F4B400;
    --dark:#222;
    --light:#ffffff;
}


section{
    padding:80px 8%;
}


.container{
    max-width:1200px;
    margin:auto;
}


/* =========================
   PROFESSIONAL PRELOADER
========================= */


#preloader{

position:fixed;
inset:0;
background:
linear-gradient(
135deg,
#5E2B97,
#24103d
);

display:flex;
justify-content:center;
align-items:center;

z-index:99999;

transition:
opacity 1s ease,
visibility 1s ease;

}



#preloader.hide{

opacity:0;
visibility:hidden;

}



.loader-container{

text-align:center;
color:white;

}



.logo-loader{

width:90px;
height:90px;

border-radius:50%;

background:#F4B400;

display:flex;
justify-content:center;
align-items:center;

margin:auto;

font-size:40px;

animation:
pulseLogo 2s infinite;

}



@keyframes pulseLogo{


0%{

transform:scale(1);

box-shadow:
0 0 0 0 rgba(244,180,0,.7);

}


50%{

transform:scale(1.1);

box-shadow:
0 0 30px rgba(244,180,0,.8);

}


100%{

transform:scale(1);

}


}




.loader-container h2{

margin-top:25px;

font-size:28px;

font-weight:800;

}



.loader-container h2 span{

color:#F4B400;

}



.loader-container p{

margin-top:10px;

font-size:16px;

opacity:.9;

}



.loading-bar{

width:260px;

height:8px;

background:
rgba(255,255,255,.3);

border-radius:20px;

overflow:hidden;

margin:30px auto 15px;

}



.progress{

height:100%;

width:0%;

background:#F4B400;

border-radius:20px;

transition:.2s;

}



.loading-text{

font-size:15px;

   }



/* =========================
   HEADER
========================= */


header{

    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    background:rgba(94,43,151,.95);
    backdrop-filter:blur(10px);

}


.navbar{

    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;

}


.logo{

    color:white;
    font-size:22px;
    font-weight:800;

}


.logo span{

    color:var(--secondary);

}


nav ul{

    display:flex;
    list-style:none;
    gap:25px;

}


nav ul li a{

    color:white;
    text-decoration:none;
    font-weight:600;
    transition:.3s;

}


nav ul li a:hover{

    color:var(--secondary);

}


.gallery-btn{

    background:var(--secondary);
    color:#222;
    padding:12px 22px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;

}


/* =========================
   HERO SECTION
========================= */


.hero{

    height:650px;
    position:relative;
    overflow:hidden;

}


.slide{

    position:absolute;
    width:100%;
    height:100%;
    opacity:0;
    transition:1.5s;

}


.slide.active{

    opacity:1;

}


.slide img{

    width:100%;
    height:100%;
    object-fit:cover;

}


.overlay{

    position:absolute;
    inset:0;
    background:linear-gradient(
        rgba(0,0,0,.5),
        rgba(94,43,151,.7)
    );

}


.hero-content{

    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    color:white;
    width:90%;

}


.hero-content h1{

    font-size:45px;
    margin-bottom:20px;

}


.hero-content p{

    font-size:20px;
    margin-bottom:30px;

}


.hero-buttons a{

    display:inline-block;
    margin:10px;
    padding:15px 30px;
    border-radius:30px;
    text-decoration:none;
    font-weight:bold;

}


.btn-primary{

    background:var(--secondary);
    color:#222;

}


.btn-outline{

    border:2px solid white;
    color:white;

}


/* =========================
   MOBILE
========================= */


@media(max-width:900px){

.navbar{

    flex-direction:column;
    gap:15px;

}


nav ul{

    flex-wrap:wrap;
    justify-content:center;

}


.hero-content h1{

    font-size:30px;

}


.hero-content p{

    font-size:16px;

}

}


</style>

</head>

</div>
