<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pleasure 1 Aluminum Enterprise</title>

<style>

/* GLOBAL */
body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#f4f4f8;
    overflow-x:hidden;
}

/* NOTIFICATION SYSTEM */
#notification-container {
    position:fixed;
    top:80px;
    right:20px;
    z-index:99999;
    display:flex;
    flex-direction:column;
    gap:10px;

    /* UPDATED: Banner 2 image as background */
    background:url("Screenshot_20260503-194406_1.png");
    background-size:cover;
    background-position:center;
    padding:10px;
    border-radius:12px;
}

/* NOTIFICATION CARD */
.notification {
    background:white;
    border-left:6px solid #7b3f98;
    padding:15px 40px 15px 15px;
    width:260px;
    border-radius:10px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    position:relative;
    animation: slideIn 0.5s ease;
}

.notification h4 {
    margin:0;
    font-size:14px;
    color:#7b3f98;
}

.notification p {
    margin:5px 0 0;
    font-size:13px;
    color:#333;
}

/* CLOSE BUTTON */
.close-btn {
    position:absolute;
    top:5px;
    right:8px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    color:#555;
}

.close-btn:hover {
    color:red;
}

/* SLIDE ANIMATION */
@keyframes slideIn {
    from { transform:translateX(100px); opacity:0; }
    to { transform:translateX(0); opacity:1; }
}

@keyframes fadeOut {
    to { opacity:0; transform:translateX(50px); }
}

/* COLOR BLINK ANIMATION */
@keyframes colorBlink {
    0% { color:red; text-shadow:0 0 18px red; }
    33% { color:#FFD700; text-shadow:0 0 18px #FFD700; }
    66% { color:#00ff6a; text-shadow:0 0 18px #00ff6a; }
    100% { color:red; text-shadow:0 0 18px red; }
}

/* PRELOADER */
#preloader {
    position:fixed;
    width:100%;
    height:100%;
    background:linear-gradient(135deg,#7b3f98,#4b2260);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:9999;
    color:white;
    transition: opacity 1.2s ease;
}

.loader {
    width:60px;
    height:60px;
    border:6px solid rgba(255,255,255,0.3);
    border-top:6px solid white;
    border-radius:50%;
    animation: spin 1s linear infinite;
    margin-bottom:20px;
}

.loader-text {
    font-size:22px;
    font-weight:bold;
    animation: colorBlink 3.5s infinite;
}

/* HEADER */
header {
    background:linear-gradient(90deg,#7b3f98,#4b2260);
    color:white;
    padding:15px;
    position:sticky;
    top:0;
    z-index:1000;
}

.brand h1 {
    margin:0;
    font-size:20px;
    animation: colorBlink 3.5s infinite;
}

/* WHATSAPP */
.whatsapp {
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:15px;
    border-radius:50%;
    font-size:20px;
    text-decoration:none;
}

@keyframes spin {
    100% { transform:rotate(360deg); }
}

</style>
</head>

<body>

<!-- NOTIFICATIONS -->
<div id="notification-container"></div>

<!-- PRELOADER -->
<div id="preloader">
    <div class="loader"></div>
    <div class="loader-text">Pleasure 1 Aluminum Enterprise</div>
</div>

<header>
    <h1 class="brand">Pleasure 1 Aluminum Enterprise</h1>
</header>

<a class="whatsapp" href="https://wa.me/233599389968">💬</a>

<script>

/* PRELOADER */
window.addEventListener("load", function () {
    setTimeout(() => {
        document.getElementById("preloader").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("preloader").style.display = "none";
            showNotifications();
        }, 1200);
    }, 2000);
});

/* CREATE NOTIFICATION */
function createNotification(title, message) {
    const container = document.getElementById("notification-container");

    const note = document.createElement("div");
    note.className = "notification";

    note.innerHTML = `
        <span class="close-btn" onclick="closeNotification(this)">×</span>
        <h4>${title}</h4>
        <p>${message}</p>
    `;

    container.appendChild(note);
}

/* CLOSE */
function closeNotification(btn) {
    const note = btn.parentElement;
    note.style.animation = "fadeOut 0.4s forwards";
    setTimeout(() => note.remove(), 400);
}

/* SHOW NOTIFICATIONS */
function showNotifications() {

    setTimeout(() => {
        createNotification("🎉 Discount Offer", "Get up to 15% discount on aluminium works this month!");
    }, 500);

    setTimeout(() => {
        createNotification("🆕 Update", "We now offer premium frameless glass installations.");
    }, 1500);

    setTimeout(() => {
        createNotification("📢 News", "Check our gallery for latest completed projects.");
    }, 2500);
}

</script>

</body>
</html>
